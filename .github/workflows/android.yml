name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD so every build is signed with the same key and updates install in place.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOTIK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          BOTIK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOTIK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOTIK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk botik-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: botik-keyboard-apk
          path: botik-keyboard.apk
