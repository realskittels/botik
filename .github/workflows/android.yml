name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK; AGP installs any missing platform itself.

      - uses: gradle/actions/setup-gradle@v6

      # Optional: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD so every build is signed with the same key and updates install in place.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOTIK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Without signing secrets, keep the same debug key between runs so a new APK
      # installs over the old one (the cache expires after ~7 days without builds).
      - name: Reuse debug signing key
        if: env.BOTIK_KEYSTORE_PATH == ''
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: botik-debug-keystore

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          BOTIK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOTIK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOTIK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk botik-keyboard.apk

      # Puts the APK in the repository root so it is visible on the main page.
      # GITHUB_TOKEN pushes do not start new workflow runs, so this cannot loop.
      - name: Commit APK to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git add -f botik-keyboard.apk
          git diff --cached --quiet || git commit -m "Update botik-keyboard.apk (build ${{ github.run_number }}) [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: botik-keyboard-apk
          path: botik-keyboard.apk

      # Publishes the APK as the latest GitHub Release, so it is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/botik-keyboard.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Botik ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: botik-keyboard.apk
          body: |
            Установка: скачайте botik-keyboard.apk ниже и откройте его на телефоне.
            Коммит: ${{ github.sha }}
